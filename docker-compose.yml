services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spas
      POSTGRES_USER: spas
      POSTGRES_PASSWORD: spas_local_password
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]

  ai-service:
    build: ./ai-service
    environment:
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-spas_internal_ai_secret_key_2026}
      AI_DATA_DIR: /app/data
      FACE_DETECTOR_PATH: /models/face_best.pt
      FACE_RECOGNITION_PATH: /models/facenet_best.pt
    volumes:
      - ./models:/models:ro
      - ./runtime/ai-data:/app/data
    expose: ["8000"]

  backend:
    build: ./backend
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://spas:spas_local_password@postgres:5432/spas
      DIRECT_URL: postgresql://spas:spas_local_password@postgres:5432/spas
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      FRONTEND_URL: http://localhost
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-spas_internal_ai_secret_key_2026}
      EVIDENCE_STORAGE_DIR: /app/storage/evidence
    depends_on: [postgres, ai-service]
    volumes: ["./runtime/evidence:/app/storage/evidence"]
    expose: ["5000"]

  frontend:
    build: ./frontend
    ports: ["80:80"]
    depends_on: [backend]

volumes:
  postgres-data:
