server {
  listen 80;
  client_max_body_size 64m;
  root /usr/share/nginx/html;
  index index.html;
  location /api/v1/ { proxy_pass http://backend:5000/api/v1/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /ws { proxy_pass http://backend:5000/ws; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location / { try_files $uri /index.html; }
}
